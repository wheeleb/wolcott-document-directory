<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wolcott Document Directory</title><style>
:root{--nav:#163a52;--blue:#1f6f9f;--bg:#eef3f6;--card:#fff;--line:#ccd8df}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:#17232b}header{background:var(--nav);color:#fff;padding:16px 22px}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;color:#d6e6ef}.app{display:grid;grid-template-columns:260px 330px 1fr;height:calc(100vh - 78px)}aside,.list{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:14px}.viewer{display:flex;flex-direction:column;min-width:0}.cat{display:block;width:100%;border:0;background:transparent;text-align:left;padding:11px;border-radius:7px;cursor:pointer;font-weight:600}.cat:hover,.cat.active{background:#dcecf5;color:#0d557f}.search{width:100%;padding:10px;border:1px solid #aebdc7;border-radius:7px;margin-bottom:12px}.item{border:1px solid var(--line);border-radius:7px;padding:10px;margin-bottom:9px;cursor:pointer}.item:hover,.item.active{border-color:var(--blue);background:#eef8fd}.item small{display:block;color:#61717a;margin-top:4px}.bar{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center;min-height:53px}.bar strong{flex:1}.btn{border:1px solid var(--blue);background:#fff;color:#125d87;border-radius:6px;padding:8px 11px;cursor:pointer;text-decoration:none}.btn.primary{background:var(--blue);color:#fff}iframe{border:0;width:100%;height:100%;background:#fff}.empty{padding:38px;text-align:center;color:#60727c}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.panel{max-width:620px;width:100%;background:#fff;border-radius:10px;padding:20px;box-shadow:0 20px 60px #0005}.panel h2{margin-top:0}.meta{display:grid;grid-template-columns:140px 1fr;gap:9px;border-top:1px solid var(--line);padding-top:14px}.meta b{color:#49606d}.close{float:right}.note{font-size:12px;color:#5d6d76;margin:0 0 12px}@media(max-width:900px){.app{grid-template-columns:220px 1fr}.viewer{grid-column:1/3;height:65vh}.app{height:auto}.list,aside{height:45vh}}
</style></head><body><header><h1>Wolcott Public Documents</h1><p>Citizen-facing directory with verified source links and record metadata</p></header><main class="app"><aside><input id="search" class="search" placeholder="Search documents"><div id="cats"></div></aside><section class="list"><p class="note">Every listed record has a source URL. Select a title to display it.</p><div id="items"></div></section><section class="viewer"><div class="bar"><strong id="title">Select a document</strong><button id="metaBtn" class="btn" disabled>Metadata</button><a id="openBtn" class="btn primary" target="_blank" rel="noopener" style="display:none">Open source</a></div><div id="stage" class="empty">Choose a category and document.</div></section></main><div id="modal" class="modal"><div class="panel"><button class="btn close" onclick="closeMeta()">Close</button><h2>Document metadata</h2><div id="meta" class="meta"></div></div></div>
<script>
const D=[
['Forms & Permits','Application for 911 Number','Form','Town','2025','Current','https://wolcottvt.org/wp-content/uploads/2025/02/911-Request-Application-Form-Dec-2025.pdf'],['Forms & Permits','Driveway Permit','Permit form','Town','2025','Current','https://wolcottvt.org/wp-content/uploads/2025/02/2025-Wolcott-Driveway-Permit.pdf'],['Forms & Permits','Overweight Permit','Permit form','Town','Undated','Current','https://wolcottvt.org/wp-content/uploads/2023/10/Overweight-Permit.pdf'],['Forms & Permits','Right of Way Excavation','Permit form','Town','Undated','Current','https://wolcottvt.org/wp-content/uploads/2023/10/Application-for-Right-of-Way-Excavation-Permit.pdf'],['Forms & Permits','Town Hall Rental Agreement','Agreement','Town','Undated','Current','https://wolcottvt.org/wp-content/uploads/2023/10/Town-Hall-Rental-Agreement.pdf'],['Forms & Permits','Consent of Candidate Form','Form','Town Clerk','Undated','Reference','https://wolcottvt.org/wp-content/uploads/2021/01/CONSENT-OF-CANDIDATE.pdf'],
['Laws & Policies','Animal Control','Ordinance','Town','Undated','Current','https://wolcottvt.org/wp-content/uploads/2019/01/20190124082711.pdf'],['Laws & Policies','Highway Standards','Ordinance','Town','2006','Current','https://wolcottvt.org/wp-content/uploads/2014/05/Highway-Standards-Ordinance-2006.pdf'],['Laws & Policies','Illegal Dumping','Ordinance','Town','Undated','Current','https://wolcottvt.org/wp-content/uploads/2014/05/Illegal-Dumping-Ordinance.pdf'],['Laws & Policies','Open Burn','Ordinance','Town','Undated','Current','https://wolcottvt.org/wp-content/uploads/2014/05/Open-Burn-Ordinance.pdf'],['Laws & Policies','Traffic Ordinance','Ordinance','Town','Undated','Current','https://wolcottvt.org/wp-content/uploads/2014/05/Traffic-Ordinance.pdf'],['Laws & Policies','Wastewater Ordinance','Ordinance','Town','2025','Final','https://wolcottvt.org/wp-content/uploads/2025/05/Wolcott-Wastewater-Ordinance-Final.pdf'],['Laws & Policies','Zoning and Subdivision Regulations','Regulation','Town','2016','Current','https://wolcottvt.org/wp-content/uploads/2023/11/Wolcott-2016-Zoning-and-Subdivsion-Bylaws-Adopted.pdf'],['Laws & Policies','Personnel Policy','Policy','Town','October 2025','Current','https://wolcottvt.org/wp-content/uploads/2025/02/Wolcott-Personnel-Policy-Revised-10-1-25.pdf'],['Laws & Policies','Purchasing Policy','Policy','Town','April 2026','Current','https://wolcottvt.org/wp-content/uploads/2025/02/Wolcott-Procurement-Policy-April-15-2026.pdf'],
['Plans & Projects','Municipal Development Plan','Town plan','Town','2026-34','Selectboard approved','https://wolcottvt.org/wp-content/uploads/2025/02/2026-2034-Municipal-Development-Plan_FINAL-draft_SB-adopted_with-maps_optimized-20260617.pdf'],['Plans & Projects','Bridge and Culvert Inventory','Map','Town','2018','Reference','https://wolcottvt.org/wp-content/uploads/2021/05/Wolcott_CulvertInventoryMapMAR29_2018.pdf'],['Plans & Projects','North Wolcott Road Bike and Pedestrian Improvements','Study','Town','2017','Final','https://wolcottvt.org/wp-content/uploads/2025/09/North-Wolcott-Road-Scoping-Study-Report-Final-2017-06-14.pdf'],['Plans & Projects','Municipal Facilities Assessment','Assessment','Town','Undated','Reference','https://wolcottvt.org/wp-content/uploads/2014/05/Municipal-Facillities-Assessment.pdf'],
['Meetings & Elections','Annual Town Meeting Minutes','Minutes','Town','2026','Final','https://wolcottvt.org/wp-content/uploads/2026/03/Annual-Town-Meeting-Minutes.pdf'],['Meetings & Elections','Annual School Meeting Minutes','Minutes','School District','2026','Final','https://wolcottvt.org/wp-content/uploads/2026/03/Annual-School-District-Meeting-Minutes.pdf'],['Meetings & Elections','Town Meeting Minutes','Minutes','Town','2025','Final','https://wolcottvt.org/wp-content/uploads/2025/03/Annual-Town-Meeting-Minutes-2025.pdf'],['Meetings & Elections','Town Meeting Warning','Warning','Town','2023','Archived','https://wolcottvt.org/wp-content/uploads/2023/02/Warning-2023-Town-Meeting-.pdf'],['Meetings & Elections','Justices of the Peace','Roster','Town Clerk','2025-27','Current','https://wolcottvt.org/wp-content/uploads/2025/02/Justice-of-the-Peace-2025-27.pdf'],
['Budgets & Finances','Town Budget','Budget','Town','FY 2027','Current','https://wolcottvt.org/wp-content/uploads/2026/01/FY-2027-Wolcott-Budget.pdf'],['Budgets & Finances','Audit Report','Audit','Town','2024','Final','https://wolcottvt.org/wp-content/uploads/2025/04/Wolcott-Town-Audit-Report-2024.pdf'],['Budgets & Finances','Audit Findings','Audit','Town','2023','Final','https://wolcottvt.org/wp-content/uploads/2024/04/Town-of-Wolcott-2023-Audit-Findings.pdf'],['Budgets & Finances','Management Letter','Audit','Town','2023','Final','https://wolcottvt.org/wp-content/uploads/2024/04/Town-of-Wolcott-2023-Management-Letter.pdf'],['Budgets & Finances','Tax Bills','Tax record','Town','2025','Published','https://wolcottvt.org/wp-content/uploads/2025/10/Wolcott-Tax-Bills-2025.pdf'],
['Reports & Records','Town Report','Annual report','Town','2026','Published','https://wolcottvt.org/wp-content/uploads/2026/02/Wolcott-Town-Report-2025-1.4.pdf'],['Reports & Records','Town Report','Annual report','Town','2024','Published','https://wolcottvt.org/wp-content/uploads/2025/02/Wolcott-Town-Report-1.9.pdf'],['Reports & Records','Grand List','Property record','Town','2026','Published','https://wolcottvt.org/wp-content/uploads/2026/08/Wolcott-VT-Grand-List-2026.txt'],['Reports & Records','Town Government Organizational Chart','Organization chart','Town','2025','Current','https://wolcottvt.org/wp-content/uploads/2025/09/Wolcott-Town-Government-Org-Chart-2025.pdf'],
['Emergency & Resilience','Preparing for a Disaster','Guide','Town','2025','Current','https://wolcottvt.org/wp-content/uploads/2025/04/LeARN-Preparing-for-a-Disaster.pdf'],['Emergency & Resilience','Hazard Mitigation Plan','Plan','Town','2020-25','Superseded','https://wolcottvt.org/wp-content/uploads/2020/11/Final-Wolcott-VT-Hazard-Mitigation-Plan-11-4-2020_v2.pdf'],
['Archives','Municipal Development Plan','Town plan','Town','2018-26','Archived','https://wolcottvt.org/wp-content/uploads/2020/10/2018-2026_Wolcott_Town_Plan.pdf'],['Archives','Municipal Development Plan','Town plan','Town','2013','Archived','https://wolcottvt.org/wp-content/uploads/2014/05/Adopted-2013-Town-Plan.pdf'],['Archives','Town Survey Results','Survey','Town','2015','Archived','https://wolcottvt.org/wp-content/uploads/2014/05/2015-SURVEY-RESULTS.pdf'],['Archives','Re-envisioning the Future of Wolcott','Study','Town','2015','Archived','https://wolcottvt.org/wp-content/uploads/2014/05/Re-Envisioning-the-Future-of-Wolcott-Final-Report.pdf']
].map((x,i)=>({id:'WOL-'+String(i+1).padStart(4,'0'),category:x[0],title:x[1],type:x[2],office:x[3],date:x[4],status:x[5],url:x[6]}));
const cats=[...new Set(D.map(x=>x.category))];let cat=cats[0],current=null;const q=s=>document.querySelector(s);
function renderCats(){q('#cats').innerHTML=cats.map(c=>`<button class="cat ${c===cat?'active':''}" onclick="setCat('${c.replaceAll("'","\\'")}')">${c} <small>(${D.filter(x=>x.category===c).length})</small></button>`).join('')}
function renderItems(){let term=q('#search').value.toLowerCase();let a=D.filter(x=>(x.category===cat||term)&&(!term||(x.title+' '+x.type+' '+x.date).toLowerCase().includes(term)));q('#items').innerHTML=a.length?a.map(x=>`<div class="item ${current&&current.id===x.id?'active':''}" onclick="show('${x.id}')"><b>${x.title}</b><small>${x.type} · ${x.date} · ${x.status}</small></div>`).join(''):'<div class="empty">No matching documents.</div>'}
function setCat(c){cat=c;renderCats();renderItems()}
function show(id){current=D.find(x=>x.id===id);q('#title').textContent=current.title;q('#openBtn').href=current.url;q('#openBtn').style.display='inline-block';q('#metaBtn').disabled=false;q('#stage').className='';q('#stage').innerHTML=`<iframe title="${current.title}" src="${current.url}"></iframe>`;renderItems()}
q('#search').addEventListener('input',renderItems);q('#metaBtn').onclick=()=>{if(!current)return;let vals={Title:current.title,Category:current.category,'Document type':current.type,'Responsible office':current.office,'Date / version':current.date,Status:current.status,'Record ID':current.id,'Source URL':current.url};q('#meta').innerHTML=Object.entries(vals).map(([k,v])=>`<b>${k}</b><span>${k==='Source URL'?`<a href="${v}" target="_blank" rel="noopener">Verified Wolcott source</a>`:v}</span>`).join('');q('#modal').classList.add('open')};function closeMeta(){q('#modal').classList.remove('open')}q('#modal').onclick=e=>{if(e.target===q('#modal'))closeMeta()};renderCats();renderItems();
</script></body></html>
